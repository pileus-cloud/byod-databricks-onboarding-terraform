name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

# Prevent two pushes to main from racing to publish overlapping releases.
concurrency:
  group: release
  cancel-in-progress: false # let an in-flight release finish; don't cancel a real publish mid-way

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release (with the @semantic-release/github plugin
          # configured here) publishes tags/releases via the GitHub API
          # using GITHUB_TOKEN below, not by pushing through the checked-out
          # git credential — safe to disable.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
