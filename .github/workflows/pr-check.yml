name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Least-privilege default: none of these jobs write to the repo or its
# checks/PRs, so the workflow-level token only needs read access. Jobs that
# need more (none do here) should declare their own `permissions:` override
# rather than widening this default.
permissions:
  contents: read

# Cancel superseded runs on the same PR instead of letting them queue/run to
# completion — avoids wasting CI minutes when a PR gets pushed to repeatedly.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing in this job pushes back to the repo

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        if: github.actor != 'dependabot[bot]'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact --recursive

  checkov:
    name: Checkov (IaC security scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          output_format: cli
          download_external_modules: true
          # Hard-fail on findings — this is a new check with no established
          # baseline yet, so the first run may need a pass to clear or
          # explicitly skip (via inline `checkov:skip=CKV_*` comments)
          # existing findings before this can stay false long-term. Flip to
          # true temporarily if that first pass needs to land separately
          # from turning enforcement on.
          soft_fail: false
